<!DOCTYPE html>

<head>

<link rel="preload" href="assets/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<body>
<a class="skip" href="#stations">Skip to the projects</a>

<header class="rail">
  <a class="rail-name" href="#top">Isaac Waithaka</a>
  <nav class="rail-track" id="railTrack" aria-label="Stations"></nav>
  <button type="button" class="lights" id="lights" aria-pressed="false" aria-label="Shop lights">
    <span class="switch" aria-hidden="true"><span class="rocker"></span></span>
    <span class="lbl">Lights</span>
  </button>
</header>

<main id="top">
  <section class="plate-band" id="plate" aria-label="Introduction"></section>

  <div class="bay" id="bay">
    <div class="bay-stage" id="bayStage"></div>
  </div>
  <div class="wrap bay-bar">
    <p>Drive the crane with the yellow pendant or your arrow keys. Tap any machine to lower the hook onto it and open that station.</p>
    <p class="bay-read" id="bayRead" aria-hidden="true"></p>
  </div>

  <div id="stations"></div>
</main>

<footer class="foot" id="foot"></footer>

<div class="pendant" id="pendant" role="group" aria-label="Crane pendant">
  <div class="pd-win">
    <span id="pdNum">Station 01</span>
    <strong id="pdName" aria-live="polite"></strong>
    <span id="pdState" class="st-state">Hook up</span>
  </div>
  <div class="pd-grid">
    <button type="button" class="pd-btn" id="pdW" aria-label="West, previous station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span class="t">West</span></button>
    <button type="button" class="pd-btn" id="pdE" aria-label="East, next station"><span class="t">East</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    <button type="button" class="pd-btn" id="pdD" aria-label="Lower the hook and open this station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5l5 -5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span class="t">Lower</span></button>
    <button type="button" class="pd-btn" id="pdU" aria-label="Raise the hook and go back to the crane"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5 -5l5 5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span class="t">Raise</span></button>
    <button type="button" class="pd-btn pd-stop" id="pdS" aria-pressed="false" aria-label="Emergency stop, turns animation off"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="currentColor"/></svg><span class="t">Stop</span></button>
  </div>
  <button type="button" class="pd-tuck" id="pdT" aria-expanded="true">Hide pendant</button>
</div>

<noscript>
  <div class="wrap" style="padding:40px 0">

  </div>
</noscript>

</body>
</html>
